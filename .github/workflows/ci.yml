name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `npm ci` against the committed lockfile: reproducible, and it fails loudly
      # if package.json and the lock have drifted instead of silently resolving
      # something else. Adding the lockfile also removed the
      # "Cannot read properties of null (reading 'edgesOut')" crash that npm hits
      # when asked to install with no lockfile at all.
      - run: npm ci --no-audit --no-fund
      # `npm run build` is the type check too: svelte-check runs inside it, so a
      # type error fails here rather than at runtime in the browser.
      - run: npm run build
      - run: npm test -- --run
        continue-on-error: true

  # The image is the deliverable: prove it builds AND serves the SPA. A build that
  # compiles but produces an empty dist is invisible otherwise.
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: webui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: it must serve the SPA
        run: |
          # AGENT_UPSTREAM is required (the Caddyfile has no default), so the container exits at
          # startup without it. Set it here to a name that does not need to resolve: this step only
          # checks that the STATIC build is served, and never calls /agent.v1.*.
          docker run -d --name webui -p 18080:8080 -e AGENT_UPSTREAM=agent:80 webui:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ | grep -qi '<html'; then
              echo "SPA served"; exit 0
            fi
            sleep 1
          done
          echo "the image did not serve an HTML page"; docker logs webui; exit 1

      # The whole point of removing the default: a deployment that forgets AGENT_UPSTREAM must fail
      # LOUDLY AT STARTUP, not come up healthy and 502 on every RPC.
      #
      # That regression is what this guards. The old default was a cluster name from whichever
      # environment built the image; a deployment without the variable answered 200 for / and 502
      # for /agent.v1.*, so the page loaded and the breakage surfaced only when a user logged in.
      - name: it must REFUSE to start without AGENT_UPSTREAM
        run: |
          set +e
          out="$(docker run --rm webui:ci 2>&1)"
          code=$?
          set -e
          echo "$out" | tail -5
          if [ "$code" -eq 0 ]; then
            echo "::error::the container started without AGENT_UPSTREAM; a missing upstream must be a startup failure, not a 502 on every RPC"
            exit 1
          fi
          echo "refused as expected (exit $code)"

      # And with the variable set it must adapt the config cleanly — otherwise the previous step
      # could pass for the wrong reason (e.g. a typo that breaks Caddy always).
      - name: it must accept AGENT_UPSTREAM when set
        run: |
          # NO leading "caddy": the image's ENTRYPOINT already is the binary, so the argument list
          # starts at the SUBCOMMAND. `docker run … webui:ci caddy validate …` passes "caddy" as the
          # subcommand and fails with 'unknown command "caddy" for "caddy"'.
          docker run --rm -e AGENT_UPSTREAM=standalone-agent.example.svc.cluster.local:80 \
            webui:ci validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # The extension-UI rule depends on a placeholder upstream, which Caddy documents but which is
      # easy to get wrong (a placeholder in a URL upstream is rejected; a port is required). `validate`
      # above only adapts the config, so this asserts the BEHAVIOUR: /ext/<id>/ reaches that name and
      # other paths do not.
      - name: the extension rule routes /ext/<id>/ to <id>-ext
        run: |
          set -euo pipefail
          # The SPA step above leaves its container holding 18080. Reusing the port fails with
          # 'driver failed programming external connectivity', which reads like a Caddy or Docker
          # networking fault rather than a leftover container.
          docker rm -f webui >/dev/null 2>&1 || true
          docker rm -f webui-ext >/dev/null 2>&1 || true

          # AGENT_UPSTREAM is required by the entrypoint; pointing it at a closed port keeps the
          # agent out of the way, since this test is only about the /ext/ rule.
          docker run -d --name webui-ext -p 18080:8080 \
            -e AGENT_UPSTREAM=127.0.0.1:18081 webui:ci
          sleep 3

          cleanup() { docker rm -f webui-ext >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          # No <id>-ext host resolves in CI, so the correct outcome is 502 — and crucially the log
          # must NAME the host it tried, proving the placeholder was substituted rather than the
          # literal string "{re.ext.1}-ext" being dialled.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/ext/github/ || true)"
          echo "GET /ext/github/ -> $code"
          docker logs webui-ext 2>&1 | tail -20
          if [ "$code" != "502" ]; then
            echo "::error::expected 502 from an unresolvable extension host, got $code"
            exit 1
          fi
          if ! docker logs webui-ext 2>&1 | grep -q 'github-ext'; then
            echo "::error::the proxy did not resolve /ext/github/ to github-ext.* — the placeholder was not substituted"
            exit 1
          fi
          # And an unrelated path must NOT be captured by the rule.
          other="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/ext/ || true)"
          echo "GET /ext/ -> $other (expect 200: falls through to the SPA)"
          echo "placeholder resolved to github-ext.*"
